<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Change Page</h2>
    <form method="POST">
        <div class="mb-3">
            <input type="text" name="user_input" class="form-control" placeholder="Type something..." required value="{{ input_text }}">
        </div>
        <button type="submit" class="btn btn-primary mb-3">Show in Textarea</button>
        <div class="mb-3">
            <textarea class="form-control" rows="5" readonly>{{ input_text }}</textarea>
        </div>
    </form>
    <a href="/" class="btn btn-secondary mt-3">Back to Home</a>
</div>
</body>
</html>
