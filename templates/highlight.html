<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Highlight Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Highlight Hatespeech from URL</h2>
    <form method="POST">
        <div class="mb-3">
            <input type="url" name="url_input" class="form-control" placeholder="Enter URL..." required value="{{ url }}">
        </div>
        <button type="submit" class="btn btn-info mb-3">Highlight</button>
    </form>

    <div class="mb-3">
        <div class="border rounded p-3" style="background:#f8f9fa;">
            {{ highlighted_text|safe }}
        </div>
    </div>
    <a href="/" class="btn btn-secondary mt-3">Back to Home</a>
</div>
</body>
</html>
